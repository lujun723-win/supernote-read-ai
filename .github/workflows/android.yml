name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build both APKs
      run: ./gradlew testDeepseekUnitTest assembleDeepseek assembleDeepseekBundled

    - name: Upload lightweight APK
      uses: actions/upload-artifact@v4
      with:
        name: ReadAssist-light
        path: app/build/outputs/apk/deepseek/*.apk
        if-no-files-found: error

    - name: Upload ECDICT APK
      uses: actions/upload-artifact@v4
      with:
        name: ReadAssist-full-ecdict
        path: app/build/outputs/apk/deepseekBundled/*.apk
        if-no-files-found: error
